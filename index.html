<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同词相遇</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    background-size: 200% 200%;
    animation: bgMove 12s ease infinite;
    color: #2d2d3a;
  }
  @keyframes bgMove {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .container {
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.6);
    padding: 44px 32px;
    border-radius: 28px;
    width: 100%;
    max-width: 440px;
    text-align: center;
    box-shadow: 0 25px 70px rgba(60, 30, 100, 0.35);
    animation: cardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  h1 {
    font-size: 30px;
    letter-spacing: 1px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #667eea, #c74b9b);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .tip {
    color: #8a8a9e;
    font-size: 14px;
    margin-bottom: 28px;
    line-height: 1.6;
  }

  h2 {
    font-size: 20px;
    margin-bottom: 18px;
    color: #3a3a4d;
  }

  label {
    font-size: 15px;
    color: #55556a;
    margin-right: 6px;
  }

  input {
    padding: 12px 14px;
    border: 2px solid #e2e2ee;
    border-radius: 14px;
    font-size: 16px;
    width: 100px;
    margin: 6px;
    outline: none;
    transition: all 0.25s;
    background: #fafafd;
  }
  input[type="text"] {
    width: 100%;
    margin: 0 0 16px;
    text-align: center;
  }
  input:focus {
    border-color: #667eea;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
  }

  button {
    padding: 13px 30px;
    background: linear-gradient(135deg, #667eea, #8e5bc7);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin: 10px 5px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 6px 18px rgba(102, 126, 234, 0.4);
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(102, 126, 234, 0.5);
  }
  button:active { transform: translateY(0); }

  .hidden { display: none; }

  .result-item {
    background: #f4f4fa;
    padding: 13px 16px;
    border-radius: 14px;
    margin: 10px 0;
    font-size: 15px;
    text-align: left;
    animation: fadeIn 0.4s ease;
  }
  .result-item.match {
    background: linear-gradient(135deg, #d8f5e3, #c4ecff);
    border-left: 4px solid #34c77b;
    font-weight: 600;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  #playerTitle {
    background: rgba(102, 126, 234, 0.1);
    padding: 10px 0;
    border-radius: 12px;
    color: #4a4a8a;
    font-size: 18px;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>🎯 同词相遇</h1>
    <p class="tip">轮流输入一个词<br>看看谁和你心有灵犀</p>

    <div id="setup">
      <label>玩家人数：</label>
      <input type="number" id="playerCount" min="2" max="10" value="3">
      <br>
      <button onclick="startGame()">开始游戏</button>
    </div>

    <div id="playArea" class="hidden">
      <h2 id="playerTitle"></h2>
      <input type="text" id="wordInput" placeholder="输入你的词…" maxlength="10"
             onkeydown="if(event.key==='Enter')submitWord()">
      <button onclick="submitWord()">提交</button>
    </div>

    <div id="resultArea" class="hidden">
      <h2>🎉 揭晓结果</h2>
      <div id="resultList"></div>
      <button onclick="location.reload()">再玩一次</button>
    </div>
  </div>

<script>
  let totalPlayers = 0;
  let currentPlayer = 0;
  let words = [];

  function startGame() {
    totalPlayers = parseInt(document.getElementById('playerCount').value);
    if (isNaN(totalPlayers) || totalPlayers < 2 || totalPlayers > 10) {
      return alert('人数需在 2-10 之间');
    }
    currentPlayer = 0;
    words = [];
    document.getElementById('setup').classList.add('hidden');
    document.getElementById('playArea').classList.remove('hidden');
    showCurrentPlayer();
  }

  function showCurrentPlayer() {
    document.getElementById('playerTitle').textContent =
      `玩家 ${currentPlayer + 1} 请输入`;
    const input = document.getElementById('wordInput');
    input.value = '';
    input.focus();
  }

  function submitWord() {
    const input = document.getElementById('wordInput');
    const word = input.value.trim();
    if (!word) return alert('请输入一个词');

    words.push(word);
    currentPlayer++;

    if (currentPlayer >= totalPlayers) {
      showResults();
    } else {
      showCurrentPlayer();
    }
  }

  function showResults() {
    document.getElementById('playArea').classList.add('hidden');
    document.getElementById('resultArea').classList.remove('hidden');

    const groups = {};
    words.forEach((w, i) => {
      if (!groups[w]) groups[w] = [];
      groups[w].push(i + 1);
    });

    const list = document.getElementById('resultList');
    list.innerHTML = '';

    Object.entries(groups)
      .sort((a, b) => b[1].length - a[1].length)
      .forEach(([word, playerNums]) => {
        const div = document.createElement('div');
        const matched = playerNums.length > 1;
        div.className = 'result-item' + (matched ? ' match' : '');
        div.textContent =
          `「${word}」— 玩家 ${playerNums.join('、')}` +
          (matched ? ' ✅ 相遇！' : '');
        list.appendChild(div);
      });
  }
</script>
</body>
</html>
