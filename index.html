<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同词相遇 · 朋友默契挑战</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; color:#fff;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .card {
    background: rgba(255,255,255,.12); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.25); border-radius:24px;
    width:100%; max-width:420px; padding:28px 24px; text-align:center;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  h1 { font-size:26px; margin-bottom:6px; letter-spacing:2px; }
  .sub { opacity:.85; font-size:14px; margin-bottom:22px; }
  .screen { display:none; }
  .screen.active { display:block; }
  input {
    width:100%; padding:14px 16px; border-radius:14px; border:none; outline:none;
    font-size:16px; margin-bottom:12px; text-align:center; background:rgba(255,255,255,.92);
  }
  input:disabled { opacity:.6; }
  button {
    width:100%; padding:14px; border:none; border-radius:14px; font-size:16px; font-weight:600;
    cursor:pointer; transition: transform .1s, opacity .2s;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .btn-primary { background:#ffd166; color:#5a3d00; margin-bottom:10px; }
  .btn-ghost { background:rgba(255,255,255,.2); color:#fff; }
  .divider { margin:16px 0; opacity:.5; font-size:13px; }
  .code-big { font-size:44px; font-weight:800; letter-spacing:10px; margin:14px 0; color:#ffd166; }
  .status { font-size:14px; opacity:.85; min-height:22px; margin:8px 0; }
  .vs { display:flex; justify-content:space-between; gap:10px; margin-bottom:16px; }
  .player { flex:1; background:rgba(255,255,255,.15); border-radius:16px; padding:12px 6px; }
  .player .name { font-size:14px; font-weight:700; word-break:break-all; }
  .round-tag { font-size:13px; opacity:.8; margin-bottom:12px; }
  .category {
    background:rgba(255,255,255,.2); border-radius:18px; padding:20px 14px;
    font-size:17px; font-weight:600; margin-bottom:18px; line-height:1.6;
  }
  .category b { color:#ffd166; }
  .reveal-box { display:flex; gap:10px; justify-content:center; margin:16px 0; }
  .word-chip {
    flex:1; max-width:160px; background:rgba(255,255,255,.9); color:#333;
    border-radius:14px; padding:14px 8px; font-size:18px; font-weight:700;
    word-break:break-all; min-height:60px; display:flex; align-items:center; justify-content:center;
  }
  .match-tip { font-size:22px; font-weight:800; margin:10px 0; min-height:30px; }
  .win { color:#7CFF9B; } .lose { color:#ffb3c1; }
  .heart { position:fixed; font-size:26px; animation: floatUp 1.2s ease-out forwards; pointer-events:none; z-index:99; }
  @keyframes floatUp { to { transform: translateY(-120px) scale(1.6); opacity:0; } }
  .hidden { display:none !important; }
  .small { font-size:12px; opacity:.7; margin-top:14px; line-height:1.6; }
  .history {
    max-height:220px; overflow-y:auto; text-align:left; font-size:14px;
    background:rgba(0,0,0,.18); border-radius:14px; padding:12px 14px; margin-bottom:16px; line-height:2;
  }
  .history .miss { opacity:.85; }
  .history .hit { color:#7CFF9B; font-weight:700; }
</style>
<base target="_blank">
</head>
<body>
<div class="card">

  <!-- 首页 -->
  <div id="screen-home" class="screen active">
    <h1>🎯 同词相遇</h1>
    <p class="sub">和朋友轮流想词，直到想到同一个词！</p>
    <input id="nameInput" maxlength="10" placeholder="输入你的昵称">
    <button class="btn-primary" onclick="createRoom()">创建房间</button>
    <div class="divider">────── 或 ──────</div>
    <input id="codeInput" maxlength="6" inputmode="numeric" placeholder="输入朋友给的6位房间号">
    <button class="btn-ghost" onclick="joinRoom()">加入房间</button>
    <p class="small">本站通过 P2P 点对点直连，无需服务器，房间号即连接密码，建议 10 分钟内使用。<br>玩法：第一轮随便想一个词，之后每轮根据上一轮两个词的共性想新词，直到两人想到同一个词！</p>
  </div>

  <!-- 等待/大厅 -->
  <div id="screen-lobby" class="screen">
    <h1 id="lobbyTitle">🏠 房间已创建</h1>
    <p class="sub" id="lobbyTip">把房间号告诉朋友，等 TA 进来</p>
    <div class="code-big" id="roomCode">------</div>
    <button class="btn-ghost" onclick="copyCode()">复制房间号</button>
    <p class="status" id="lobbyStatus">等待朋友加入…</p>
    <button id="startBtn" class="btn-primary hidden" onclick="startGame()">开始游戏 🎮</button>
  </div>

  <!-- 游戏 -->
  <div id="screen-game" class="screen">
    <div class="vs">
      <div class="player"><div class="name" id="myNameTag">你</div></div>
      <div class="player"><div class="name" id="peerNameTag">对方</div></div>
    </div>
    <p class="round-tag" id="roundTag">第 1 轮</p>
    <div class="category" id="hintBox">💡 随便想一个词开始吧！</div>
    <div id="inputArea">
      <input id="answerInput" maxlength="12" placeholder="心里想的词，别让对方看到！" autocomplete="off">
      <button class="btn-primary" id="submitBtn" onclick="submitAnswer()">锁定答案 🔒</button>
      <p class="status" id="gameStatus"></p>
    </div>
    <div id="revealArea" class="hidden">
      <div class="reveal-box">
        <div class="word-chip" id="myWord">?</div>
        <div class="word-chip" id="peerWord">?</div>
      </div>
      <p class="match-tip" id="matchTip"></p>
      <button class="btn-primary" id="nextBtn" onclick="onNextClick()">继续想词 ▶</button>
    </div>
  </div>

  <!-- 结算 -->
  <div id="screen-end" class="screen">
    <h1>🎉 同词相遇！</h1>
    <p class="sub" id="endStats"></p>
    <div class="history" id="historyBox"></div>
    <button class="btn-primary" onclick="restart()">再来一局 🔁</button>
    <button class="btn-ghost" onclick="location.reload()">返回首页 🏠</button>
  </div>

</div>

<script>
const PREFIX = "tongci-game-v2-";

let peer=null, conn=null, isHost=false, myCode="";
let myName="", peerName="";
let myAnswer="", peerAnswer="";
let round=0, misses=0, playing=false;
let matched=false, awaitingNext=false;
let myHist=[], peerHist=[];

function $(id){ return document.getElementById(id); }
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active")); $(id).classList.add("active"); }
function norm(w){ return w.trim().toLowerCase().replace(/\s+/g,""); }

function getMyName(){ myName = $("nameInput").value.trim() || "神秘人"; }

/* ---------- 创建房间（房主） ---------- */
function createRoom(){
  getMyName();
  myCode = String(Math.floor(100000 + Math.random()*900000));
  $("lobbyTitle").textContent = "🏠 房间已创建";
  $("lobbyTip").textContent = "把房间号告诉朋友，等 TA 进来";
  $("roomCode").textContent = myCode;
  $("lobbyStatus").textContent = "正在连接服务器…";
  $("startBtn").classList.add("hidden");
  show("screen-lobby");
  isHost = true;
  peer = new Peer(PREFIX + myCode);
  peer.on("open", ()=>{ $("lobbyStatus").textContent = "等待朋友加入…"; });
  peer.on("connection", c => {
    conn = c;
    wireConn();
    conn.on("data", d => {
      if(d.t === "join"){
        peerName = d.name || "对方";
        $("lobbyStatus").textContent = "✅ " + peerName + " 已加入！";
        $("startBtn").classList.remove("hidden");
        send({t:"welcome", name:myName});
      }
    });
  });
  peer.on("error", err => {
    if(err.type === "unavailable-id"){ createRoom(); }
    else $("lobbyStatus").textContent = "连接出错：" + err.type;
  });
}

/* ---------- 加入房间（朋友） ---------- */
function joinRoom(){
  getMyName();
  const code = $("codeInput").value.trim();
  if(!/^\d{6}$/.test(code)){ alert("请输入6位数字房间号"); return; }
  myCode = code; isHost = false;
  $("lobbyTitle").textContent = "🚪 正在加入…";
  $("lobbyTip").textContent = "房间号：" + code;
  $("roomCode").textContent = code;
  $("lobbyStatus").textContent = "连接中…";
  show("screen-lobby");
  peer = new Peer();
  peer.on("open", ()=>{
    conn = peer.connect(PREFIX + code);
    wireConn();
    conn.on("open", ()=> send({t:"join", name:myName}) );
    $("lobbyStatus").textContent = "等待房主回应…";
  });
  peer.on("error", err=>{
    $("lobbyStatus").textContent = "连接失败：" + (err.type==="peer-unavailable" ? "房间不存在或已过期" : err.type);
  });
}

function wireConn(){
  conn.on("data", onData);
  conn.on("close", ()=>{
    if(playing){ alert("对方已断开连接"); }
    location.reload();
  });
}
function send(obj){ if(conn && conn.open) conn.send(obj); }

function copyCode(){
  navigator.clipboard.writeText(myCode).then(()=>alert("房间号已复制，快发给朋友吧！"));
}

/* ---------- 消息处理 ---------- */
function onData(d){
  if(d.t === "welcome"){
    peerName = d.name || "对方";
    $("lobbyStatus").textContent = "已加入 " + peerName + " 的房间，等 TA 开始～";
    $("lobbyTitle").textContent = "🏠 已加入房间";
  }
  else if(d.t === "start"){ beginRound(); }
  else if(d.t === "answer"){ peerAnswer = d.word; maybeReveal(); }
  else if(d.t === "next"){ if(awaitingNext && !matched) beginRound(); }
  else if(d.t === "restart"){ doRestart(); }
}

/* ---------- 游戏流程 ---------- */
function startGame(){
  send({t:"start"});
  beginRound();
}

function beginRound(){
  playing = true; round++;
  matched = false; awaitingNext = false;
  myAnswer = ""; peerAnswer = "";
  $("myNameTag").textContent = "你·" + myName;
  $("peerNameTag").textContent = peerName || "对方";
  $("roundTag").textContent = "第 " + round + " 轮";
  if(round === 1){
    $("hintBox").innerHTML = "💡 随便想一个词，输入后锁定！<br><small>之后每轮要根据上一轮两个词的共性想新词哦</small>";
  } else {
    const a = myHist[myHist.length-1], b = peerHist[peerHist.length-1];
    $("hintBox").innerHTML = "🔁 上一轮的词：<b>「" + esc(a) + "」</b> 和 <b>「" + esc(b) + "」</b><br><small>想想它们的共性，输入一个相关的词</small>";
  }
  $("answerInput").value = ""; $("answerInput").disabled = false;
  $("submitBtn").disabled = false;
  $("gameStatus").textContent = "";
  $("matchTip").textContent = ""; $("matchTip").className = "match-tip";
  $("nextBtn").textContent = "继续想词 ▶";
  $("inputArea").classList.remove("hidden");
  $("revealArea").classList.add("hidden");
  show("screen-game");
}

function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

function submitAnswer(){
  const w = $("answerInput").value;
  if(!norm(w)){ $("gameStatus").textContent = "先写一个词再锁定哦"; return; }
  myAnswer = w.trim();
  $("answerInput").disabled = true; $("submitBtn").disabled = true;
  send({t:"answer", word:myAnswer});
  if(peerAnswer !== ""){ reveal(); }
  else { $("gameStatus").textContent = "已锁定 ✅ 等待对方…"; }
}
function maybeReveal(){ if(myAnswer !== "") reveal(); }

function reveal(){
  myHist.push(myAnswer); peerHist.push(peerAnswer);
  $("inputArea").classList.add("hidden");
  $("revealArea").classList.remove("hidden");
  $("myWord").textContent = myAnswer;
  $("peerWord").textContent = peerAnswer;
  const ok = norm(myAnswer) === norm(peerAnswer);
  const tip = $("matchTip");
  if(ok){
    matched = true;
    tip.textContent = "🎉 同词相遇！";
    tip.className = "match-tip win";
    $("nextBtn").textContent = "查看结算 🏁";
    burst();
  } else {
    misses++;
    awaitingNext = true;
    tip.textContent = "💔 第 " + misses + " 次擦肩而过";
    tip.className = "match-tip lose";
  }
}

function onNextClick(){
  if(matched){ showEnd(); return; }
  if(!awaitingNext) return;   // 防重复点击/防双方同时点的消息冲突
  send({t:"next"});
  beginRound();
}

/* ---------- 结算 ---------- */
function showEnd(){
  $("endStats").innerHTML = "你们用了 <b style='color:#ffd166'>" + round + "</b> 轮才想到同一个词「<b style='color:#ffd166'>" + esc(myAnswer) + "」<br>期间 <b style='color:#ffb3c1'>" + misses + "</b> 次擦肩而过 💨";
  let html = "";
  for(let i=0; i<myHist.length; i++){
    if(i === myHist.length-1){
      html += "<div class='hit'>第" + (i+1) + "轮：「" + esc(myHist[i]) + "」🎉 相遇！</div>";
    } else {
      html += "<div class='miss'>第" + (i+1) + "轮：「" + esc(myHist[i]) + "」 vs 「" + esc(peerHist[i]) + "」</div>";
    }
  }
  $("historyBox").innerHTML = html;
  show("screen-end");
  burst();
}

function restart(){
  send({t:"restart"});
  doRestart();
}
function doRestart(){
  round = 0; misses = 0;
  myHist = []; peerHist = [];
  matched = false; awaitingNext = false;
  beginRound();
}

function burst(){
  for(let i=0;i<10;i++){
    const h = document.createElement("div");
    h.className = "heart"; h.textContent = ["💖","✨","🎉","💛"][i%4];
    h.style.left = (30+Math.random()*40) + "%";
    h.style.top = "45%";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(), 1300);
  }
}
</script>
</body>
</html>
